<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tris - GameZone</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo">&#x1F3AE; GameZone</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="snake.html">Snake</a>
      <a href="tris.html" class="active">Tris</a>
      <a href="memory.html">Memory</a>
      <a href="breakout.html">Breakout</a>
      <a href="chess.html">&#x265F; Scacchi</a>
    </nav>
  </header>

  <main class="game-page">
    <h1>&#x2B55; <span>Tris</span></h1>
    <p class="status-msg" id="status">Inizia una partita!</p>
    <div class="tris-board" id="board">
      <div class="tris-cell" data-i="0"></div><div class="tris-cell" data-i="1"></div><div class="tris-cell" data-i="2"></div>
      <div class="tris-cell" data-i="3"></div><div class="tris-cell" data-i="4"></div><div class="tris-cell" data-i="5"></div>
      <div class="tris-cell" data-i="6"></div><div class="tris-cell" data-i="7"></div><div class="tris-cell" data-i="8"></div>
    </div>
    <div style="display:flex; gap:.8rem; flex-wrap:wrap; justify-content:center;">
      <button class="btn" id="vs-human">&#x1F465; 2 Giocatori</button>
      <button class="btn btn-outline" id="vs-cpu">&#x1F916; vs CPU</button>
      <button class="btn" id="resetBtn">&#x1F504; Nuova partita</button>
    </div>
  </main>

  <footer><p>&copy; 2026 GameZone</p></footer>

  <script>
    const cells = document.querySelectorAll('.tris-cell');
    const statusEl = document.getElementById('status');
    const resetBtn = document.getElementById('resetBtn');
    const vsCpuBtn = document.getElementById('vs-cpu');
    const vsHumanBtn = document.getElementById('vs-human');
    const WIN_LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    let board, currentPlayer, gameActive, vsComputer;

    function init() {
      board = Array(9).fill('');
      currentPlayer = 'X';
      gameActive = true;
      cells.forEach(c => { c.innerHTML = ''; c.classList.remove('taken', 'win'); });
      updateStatus();
    }

    function updateStatus() {
      if (!gameActive) return;
      statusEl.textContent = vsComputer
        ? (currentPlayer === 'X' ? 'Il tuo turno' : 'CPU sta pensando...')
        : `Turno di ${currentPlayer}`;
    }

    function checkWin(player) {
      return WIN_LINES.find(line => line.every(i => board[i] === player)) || null;
    }

    function isDraw() { return board.every(v => v !== ''); }

    function makeMove(i, player) {
      board[i] = player;
      cells[i].innerHTML = `<span class="mark ${player.toLowerCase()}" aria-label="${player}">${player}</span>`;
      cells[i].classList.add('taken');
      const winLine = checkWin(player);
      if (winLine) {
        winLine.forEach(idx => cells[idx].classList.add('win'));
        statusEl.textContent = `${player} vince!`;
        gameActive = false;
        return;
      }
      if (isDraw()) {
        statusEl.textContent = 'Pareggio!';
        gameActive = false;
        return;
      }
      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      updateStatus();
      if (vsComputer && currentPlayer === 'O' && gameActive) setTimeout(cpuMove, 250);
    }

    function handleClick(e) {
      const i = parseInt(e.target.dataset.i, 10);
      if (!gameActive || board[i] !== '' || (vsComputer && currentPlayer === 'O')) return;
      makeMove(i, currentPlayer);
    }

    function cpuMove() {
      const empty = board.map((v, i) => v === '' ? i : null).filter(v => v !== null);
      if (!empty.length) return;
      makeMove(empty[Math.floor(Math.random() * empty.length)], 'O');
    }

    cells.forEach(c => c.addEventListener('click', handleClick));
    resetBtn.addEventListener('click', init);
    vsCpuBtn.addEventListener('click', () => { vsComputer = true; init(); });
    vsHumanBtn.addEventListener('click', () => { vsComputer = false; init(); });

    vsComputer = false;
    init();
  </script>
</body>
</html>
