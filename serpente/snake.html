<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake — GameZone</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="logo">🎮 GameZone</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="snake.html" class="active">Snake</a>
      <a href="tris.html">Tris</a>
      <a href="memory.html">Memory</a>
      <a href="breakout.html">Breakout</a>
      <a href="chess.html">♟ Scacchi</a>
    </nav>
  </header>

  <main class="game-page">
    <h1>🐍 <span>Snake</span></h1>

    <div class="score-bar">
      <div>Punteggio: <b id="score">0</b></div>
      <div>Record: <b id="best">0</b></div>
    </div>

    <canvas id="canvas" width="400" height="400"></canvas>

    <div class="hint">Usa le frecce ← ↑ ↓ → oppure WASD per muoverti</div>

    <div style="display:flex; gap:.8rem; flex-wrap:wrap; justify-content:center;">
      <button class="btn" id="startBtn">▶ Inizia</button>
      <button class="btn btn-outline" id="pauseBtn" disabled>⏸ Pausa</button>
    </div>

    <!-- Mobile D-pad -->
    <div id="dpad" style="display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px);gap:4px;margin-top:.5rem;">
      <div></div>
      <button class="btn" data-dir="UP"    style="padding:0;font-size:1.2rem;">↑</button>
      <div></div>
      <button class="btn" data-dir="LEFT"  style="padding:0;font-size:1.2rem;">←</button>
      <div></div>
      <button class="btn" data-dir="RIGHT" style="padding:0;font-size:1.2rem;">→</button>
      <div></div>
      <button class="btn" data-dir="DOWN"  style="padding:0;font-size:1.2rem;">↓</button>
      <div></div>
    </div>
  </main>

  <footer><p>© 2026 GameZone</p></footer>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl  = document.getElementById('best');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');

    const GRID = 20;
    const COLS = canvas.width  / GRID;
    const ROWS = canvas.height / GRID;

    let snake, dir, nextDir, food, score, best, loop, running, paused;

    best = parseInt(localStorage.getItem('snakeBest') || '0');
    bestEl.textContent = best;

    function init() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      scoreEl.textContent = 0;
      placeFood();
      draw();
    }

    function placeFood() {
      let pos;
      do {
        pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      food = pos;
    }

    function step() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
      // Self collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;
        if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('snakeBest', best); }
        placeFood();
      } else {
        snake.pop();
      }
      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Grid (subtle)
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++) {
        ctx.strokeRect(x * GRID, y * GRID, GRID, GRID);
      }

      // Food
      ctx.fillStyle = '#e94560';
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID/2, food.y * GRID + GRID/2, GRID/2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Snake
      snake.forEach((seg, i) => {
        const ratio = 1 - i / snake.length;
        ctx.fillStyle = `hsl(${140 + ratio * 30}, 70%, ${30 + ratio * 25}%)`;
        ctx.beginPath();
        ctx.roundRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2, 4);
        ctx.fill();
      });

      // Head eyes
      const h = snake[0];
      ctx.fillStyle = '#fff';
      const ex = dir.x === 0 ? [4, 12] : (dir.x > 0 ? [12, 12] : [4, 4]);
      const ey = dir.y === 0 ? [4, 12] : (dir.y > 0 ? [12, 12] : [4, 4]);
      ctx.beginPath();
      ctx.arc(h.x * GRID + ex[0], h.y * GRID + ey[0], 2.5, 0, Math.PI * 2);
      ctx.arc(h.x * GRID + ex[1], h.y * GRID + ey[1], 2.5, 0, Math.PI * 2);
      ctx.fill();
    }

    function gameOver() {
      clearInterval(loop);
      running = false;
      startBtn.disabled = false;
      pauseBtn.disabled = true;
      startBtn.textContent = '🔄 Rigioca';

      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#e94560';
      ctx.font = 'bold 32px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText('Game Over!', canvas.width/2, canvas.height/2 - 20);
      ctx.fillStyle = '#eaeaea';
      ctx.font = '18px Segoe UI';
      ctx.fillText(`Punteggio: ${score}`, canvas.width/2, canvas.height/2 + 18);
    }

    startBtn.addEventListener('click', () => {
      clearInterval(loop);
      init();
      running = true; paused = false;
      const speed = 120;
      loop = setInterval(step, speed);
      startBtn.textContent = '▶ Inizia';
      startBtn.disabled = true;
      pauseBtn.disabled = false;
    });

    pauseBtn.addEventListener('click', () => {
      if (!running) return;
      if (paused) {
        loop = setInterval(step, 120);
        pauseBtn.textContent = '⏸ Pausa';
        paused = false;
      } else {
        clearInterval(loop);
        pauseBtn.textContent = '▶ Riprendi';
        paused = true;
      }
    });

    // Keyboard
    const keyMap = {
      ArrowUp:'UP', ArrowDown:'DOWN', ArrowLeft:'LEFT', ArrowRight:'RIGHT',
      w:'UP', s:'DOWN', a:'LEFT', d:'RIGHT',
      W:'UP', S:'DOWN', A:'LEFT', D:'RIGHT'
    };
    const dirMap = { UP:{x:0,y:-1}, DOWN:{x:0,y:1}, LEFT:{x:-1,y:0}, RIGHT:{x:1,y:0} };
    const opposite = { UP:'DOWN', DOWN:'UP', LEFT:'RIGHT', RIGHT:'LEFT' };

    document.addEventListener('keydown', e => {
      const d = keyMap[e.key];
      if (d) {
        e.preventDefault();
        const cur = Object.keys(dirMap).find(k => dirMap[k].x === dir.x && dirMap[k].y === dir.y);
        if (d !== opposite[cur]) nextDir = dirMap[d];
      }
    });

    // D-pad
    document.querySelectorAll('#dpad button').forEach(btn => {
      btn.addEventListener('click', () => {
        const d = btn.dataset.dir;
        const cur = Object.keys(dirMap).find(k => dirMap[k].x === dir.x && dirMap[k].y === dir.y);
        if (d !== opposite[cur]) nextDir = dirMap[d];
      });
    });

    init();
  </script>

</body>
</html>
