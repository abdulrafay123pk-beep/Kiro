<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Breakout — GameZone</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="logo">🎮 GameZone</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="snake.html">Snake</a>
      <a href="tris.html">Tris</a>
      <a href="memory.html">Memory</a>
      <a href="breakout.html" class="active">Breakout</a>
      <a href="chess.html">♟ Scacchi</a>
    </nav>
  </header>

  <main class="game-page">
    <h1>🧱 <span>Breakout</span></h1>

    <div class="score-bar">
      <div>Punteggio: <b id="score">0</b></div>
      <div>Vite: <b id="lives">3</b></div>
      <div>Livello: <b id="level">1</b></div>
    </div>

    <canvas id="canvas" width="480" height="380"></canvas>

    <div class="hint">Mouse o tocco per muovere il piatto • Spazio per iniziare</div>

    <div style="display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;">
      <button class="btn" id="startBtn">▶ Inizia</button>
      <button class="btn btn-outline" id="pauseBtn" disabled>⏸ Pausa</button>
    </div>
  </main>

  <footer><p>© 2026 GameZone</p></footer>

  <script>
    const canvas  = document.getElementById('canvas');
    const ctx     = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const levelEl = document.getElementById('level');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');

    const W = canvas.width, H = canvas.height;

    // Paddle
    const PADDLE_H = 12, PADDLE_W = 90;
    let paddle = { x: W/2 - PADDLE_W/2, y: H - 30, w: PADDLE_W, h: PADDLE_H };

    // Ball
    let ball;
    const BALL_R = 8;

    // Bricks
    const BRICK_COLS = 10, BRICK_ROWS = 4;
    const BRICK_W = (W - 20) / BRICK_COLS;
    const BRICK_H = 18;
    const BRICK_PAD = 3;
    const BRICK_OFFSET_X = 10;
    const BRICK_OFFSET_Y = 40;
    let bricks, score, lives, level, running, paused, animId;

    const COLORS = ['#e94560','#f97316','#facc15','#4ade80','#60a5fa','#a78bfa','#f472b6','#94a3b8'];

    function initBricks() {
      bricks = [];
      for (let r = 0; r < BRICK_ROWS; r++) {
        for (let c = 0; c < BRICK_COLS; c++) {
          bricks.push({
            x: BRICK_OFFSET_X + c * BRICK_W,
            y: BRICK_OFFSET_Y + r * BRICK_H,
            w: BRICK_W - BRICK_PAD,
            h: BRICK_H - BRICK_PAD,
            color: COLORS[r % COLORS.length],
            alive: true
          });
        }
      }
    }

    function resetBall() {
      const angle = (Math.random() * 60 + 60) * Math.PI / 180;
      const speed = 4 + level * 0.5;
      ball = {
        x: W / 2,
        y: H - 60,
        dx: Math.cos(angle) * speed * (Math.random() < 0.5 ? 1 : -1),
        dy: -Math.sin(angle) * speed
      };
    }

    function init(lvl = 1) {
      level = lvl;
      score = 0;
      lives = 3;
      scoreEl.textContent = 0;
      livesEl.textContent = 3;
      levelEl.textContent = level;
      paddle.x = W/2 - PADDLE_W/2;
      initBricks();
      resetBall();
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Bricks
      bricks.forEach(b => {
        if (!b.alive) return;
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, b.w, b.h, 4);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(b.x + 2, b.y + 2, b.w - 4, 5);
      });

      // Paddle
      const grad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.h);
      grad.addColorStop(0, '#60a5fa');
      grad.addColorStop(1, '#2563eb');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
      ctx.fill();

      // Ball
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath();
      ctx.arc(ball.x - 2, ball.y - 2, BALL_R / 3, 0, Math.PI * 2);
      ctx.fill();
    }

    function update() {
      ball.x += ball.dx;
      ball.y += ball.dy;

      // Wall bounce
      if (ball.x - BALL_R < 0)     { ball.x = BALL_R; ball.dx *= -1; }
      if (ball.x + BALL_R > W)     { ball.x = W - BALL_R; ball.dx *= -1; }
      if (ball.y - BALL_R < 0)     { ball.y = BALL_R; ball.dy *= -1; }

      // Paddle
      if (
        ball.y + BALL_R >= paddle.y &&
        ball.y + BALL_R <= paddle.y + paddle.h + Math.abs(ball.dy) &&
        ball.x >= paddle.x - BALL_R &&
        ball.x <= paddle.x + paddle.w + BALL_R
      ) {
        ball.dy = -Math.abs(ball.dy);
        // Angle based on hit position
        const rel = (ball.x - paddle.x) / paddle.w - 0.5;
        ball.dx = rel * 8;
      }

      // Lost ball
      if (ball.y + BALL_R > H) {
        lives--;
        livesEl.textContent = lives;
        if (lives <= 0) { gameOver(); return; }
        resetBall();
      }

      // Brick collision
      for (const b of bricks) {
        if (!b.alive) continue;
        if (
          ball.x + BALL_R > b.x && ball.x - BALL_R < b.x + b.w &&
          ball.y + BALL_R > b.y && ball.y - BALL_R < b.y + b.h
        ) {
          b.alive = false;
          score += 10;
          scoreEl.textContent = score;

          const fromLeft   = Math.abs((ball.x + BALL_R) - b.x);
          const fromRight  = Math.abs((ball.x - BALL_R) - (b.x + b.w));
          const fromTop    = Math.abs((ball.y + BALL_R) - b.y);
          const fromBottom = Math.abs((ball.y - BALL_R) - (b.y + b.h));
          const min = Math.min(fromLeft, fromRight, fromTop, fromBottom);
          if (min === fromTop || min === fromBottom) ball.dy *= -1;
          else ball.dx *= -1;
          break;
        }
      }

      // Level clear
      if (bricks.every(b => !b.alive)) {
        level++;
        levelEl.textContent = level;
        initBricks();
        resetBall();
        showOverlay(`🎉 Livello ${level}!`, 1500);
      }
    }

    function gameLoop() {
      if (!running || paused) return;
      update();
      draw();
      animId = requestAnimationFrame(gameLoop);
    }

    function gameOver() {
      running = false;
      cancelAnimationFrame(animId);
      startBtn.disabled = false;
      startBtn.textContent = '🔄 Rigioca';
      pauseBtn.disabled = true;
      showOverlay(`Game Over!\nPunteggio: ${score}`, 0);
    }

    function showOverlay(msg, autoHide) {
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#e94560';
      ctx.font = 'bold 28px Segoe UI';
      ctx.textAlign = 'center';
      const lines = msg.split('\n');
      lines.forEach((line, i) => ctx.fillText(line, W/2, H/2 - 10 + i * 38));
    }

    startBtn.addEventListener('click', () => {
      cancelAnimationFrame(animId);
      init(1);
      running = true; paused = false;
      startBtn.disabled = true;
      pauseBtn.disabled = false;
      startBtn.textContent = '▶ Inizia';
      gameLoop();
    });

    pauseBtn.addEventListener('click', () => {
      if (!running) return;
      paused = !paused;
      pauseBtn.textContent = paused ? '▶ Riprendi' : '⏸ Pausa';
      if (!paused) gameLoop();
    });

    document.addEventListener('keydown', e => {
      if (e.code === 'Space') { pauseBtn.click(); }
    });

    // Mouse
    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      const mx = (e.clientX - rect.left) * scaleX;
      paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w / 2));
      if (running && !paused) { cancelAnimationFrame(animId); gameLoop(); }
    });

    // Touch
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      const tx = (e.touches[0].clientX - rect.left) * scaleX;
      paddle.x = Math.max(0, Math.min(W - paddle.w, tx - paddle.w / 2));
    }, { passive: false });

    init(1);
    draw();
  </script>

</body>
</html>
